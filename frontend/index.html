<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" href="favicon.ico" />
    <!-- Chart.js v4 + zoom plugin v2 (requires hammerjs for pinch) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
      </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>Temperature Visualizer</h1>
        <form id="dateForm">
          <div class="form-row">
            <div class="field-group">
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" name="startDate" required />
            </div>
            <div class="field-group">
              <label for="endDate">End Date</label>
              <input type="date" id="endDate" name="endDate" required />
            </div>
            <button type="submit" id="submitBtn">
              <span class="btn-text">Load Data</span>
              <span class="btn-icon">→</span>
            </button>
          </div>
        </form>
      </div>
    </header>

    <main>
      <p id="instructions" class="instructions-banner" style="display:none;"></p>

      <div id="app">
        <div id="main-container">
          <div id="chart-wrapper">
            <div id="chart-toolbar">
              <div class="hint-text">
                <span>🖱️ Scroll to zoom</span>
                <span>🖱 Drag to pan</span>
                <span>📍 Click to drop marker</span>
              </div>
              <button id="reset-zoom-btn" title="Reset zoom">Reset Zoom</button>
            </div>
            <div id="chart-container">
              <div id="empty-state">
                <div class="empty-icon">📈</div>
                <p>Enter a date range to visualize temperature data</p>
              </div>
              <canvas id="temperatureChart"></canvas>
              <!-- Crosshair + marker overlay -->
              <canvas id="overlay-canvas"></canvas>
            </div>
            <!-- Marker info bar -->
            <div id="marker-bar" style="display:none;">
              <div id="marker-bar-content"></div>
              <button id="clear-markers-btn" title="Clear markers">✕ Clear</button>
            </div>
          </div>
          <div id="custom-legend"></div>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Temperature Visualizer</p>
    </footer>

    <script type="module" src="index.js"></script>
  </body>
</html>
